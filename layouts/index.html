<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Site.Params.subtitle }}" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="/assets/index.css" />
</head>
<body>
  <main class="main">
    <h1>{{ .Site.Title }}</h1>
    <hr />
    <p>{{ .Site.Params.subtitle }}</p>

    <div id="myBtnContainer">
      <button class="btn active" onclick="filterSelection('all')">Show all</button>
      {{ range .Site.Data.projects.categories }}
      <button class="btn" onclick="filterSelection('{{ . }}')">{{ . }}</button>
      {{ end }}
    </div>

    <div class="row">
      {{ range .Site.Data.projects.items }}
      <div class="column {{ delimit .categories " " }}">
        <div class="content">
          {{ with .image }}<img src="{{ . }}" alt="{{ .name }}" style="width:100%" />{{ end }}
          <h3>{{ .name }}</h3>
          <p>{{ .desc }}</p>
          <div class="btn-group">
            {{ with .website }}<a href="{{ . }}" target="_blank" rel="noopener noreferrer"><button><i class="fa fa-paperclip"></i> Website</button></a>{{ end }}
            {{ with .repo }}<a href="{{ . }}" target="_blank" rel="noopener noreferrer"><button><i class="fa fa-github"></i> Repo</button></a>{{ end }}
          </div>
        </div>
      </div>
      {{ end }}
    </div>
  </main>

  <footer style="max-width:1000px;margin:30px auto;color:#999;font-size:13px;text-align:center;">
    {{ .Site.Params.footer }}
  </footer>

  <script src="/assets/index.js"></script>
</body>
</html>
