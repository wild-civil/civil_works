site_name: 我的作品
site_description: 我做过的硬件、项目与开源作品集

# 部署到 GitHub Pages：站点地址（决定资源路径 / canonical / Sitemap）
# 用户站点 wild-civil.github.io 已绑定 blog2.hanvon.top，但本项目在
# Settings → Pages → Custom domain 独立设了 works.hanvon.top，会覆盖默认继承。
site_url: https://works.hanvon.top/

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换浅色
  features:
    - content.action.edit
    - content.code.copy
    - navigation.top
    - toc.follow
  custom_dir: overrides

extra_css:
  - stylesheets/extra.css

nav:
  - 我的作品: index.md

plugins:
  - minify:
      minify_html: true
